<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IIEST Shibpur SGPA Calculator</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #eef2f7;
        text-align: center;
        padding: 30px;
        transition: background-color 0.5s ease;
    }
    h1 { color: #1a3d7c; margin-bottom: 5px; }
    p.subhead { color: #555; margin-top: 0; }

    table {
        margin: 20px auto;
        border-collapse: collapse;
        background-color: #ffffff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    th, td {
        border: 1px solid #ccc;
        padding: 8px 12px;
    }
    th { background-color: #1a3d7c; color: #fff; }

    input[type="text"], input[type="number"] {
        padding: 6px;
        border: 1px solid #aaa;
        border-radius: 4px;
        text-align: center;
    }
    input.sub-name { width: 220px; text-align: left; }
    input.num-input { width: 80px; }

    button {
        margin-top: 15px;
        padding: 10px 22px;
        font-size: 16px;
        background-color: #1a3d7c;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover { background-color: #12295a; }

    #result {
        max-width: 520px;
        margin: 25px auto;
        padding: 20px;
        border-radius: 8px;
        font-size: 17px;
        font-weight: bold;
        display: none;
        transition: background-color 0.5s ease, color 0.5s ease;
    }

    .pass-result {
        background-color: #d4edda;
        color: #155724;
        border: 2px solid #28a745;
    }
    .fail-result {
        background-color: #f8d7da;
        color: #721c24;
        border: 2px solid #dc3545;
    }

    .error {
        color: #a00;
        font-weight: bold;
    }
</style>
</head>
<body>

<h1>Student Grade &amp; SGPA Calculator</h1>
<p class="subhead">IIEST Shibpur Grading System</p>

<table id="marksTable">
    <tr>
        <th>Sl.</th>
        <th>Subject Name</th>
        <th>Credits (c<sub>i</sub>)</th>
        <th>Marks (0-100)</th>
    </tr>
    <tr>
        <td>1</td>
        <td><input type="text" id="sub0" class="sub-name" value="Mathematics"></td>
        <td><input type="number" id="cred0" class="num-input" min="1" max="10" value="4"></td>
        <td><input type="number" id="marks0" class="num-input" min="0" max="100"></td>
    </tr>
    <tr>
        <td>2</td>
        <td><input type="text" id="sub1" class="sub-name" value="Physics"></td>
        <td><input type="number" id="cred1" class="num-input" min="1" max="10" value="3"></td>
        <td><input type="number" id="marks1" class="num-input" min="0" max="100"></td>
    </tr>
    <tr>
        <td>3</td>
        <td><input type="text" id="sub2" class="sub-name" value="Programming"></td>
        <td><input type="number" id="cred2" class="num-input" min="1" max="10" value="3"></td>
        <td><input type="number" id="marks2" class="num-input" min="0" max="100"></td>
    </tr>
    <tr>
        <td>4</td>
        <td><input type="text" id="sub3" class="sub-name" value="Professional Communication"></td>
        <td><input type="number" id="cred3" class="num-input" min="1" max="10" value="3"></td>
        <td><input type="number" id="marks3" class="num-input" min="0" max="100"></td>
    </tr>
    <tr>
        <td>5</td>
        <td><input type="text" id="sub4" class="sub-name" value="Computer Laboratory"></td>
        <td><input type="number" id="cred4" class="num-input" min="1" max="10" value="2"></td>
        <td><input type="number" id="marks4" class="num-input" min="0" max="100"></td>
    </tr>
</table>

<p id="errorMsg" class="error"></p>

<button onclick="calculateSGPA()">Calculate SGPA</button>

<div id="result"></div>

<script src="script.js"></script>

</body>
</html>
